name: Deploy to AKS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Azure Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}
    
    - name: Build and push Backend image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./backend/Dockerfile
        push: true
        tags: |
          ${{ secrets.ACR_LOGIN_SERVER }}/medical-backend:${{ github.sha }}
          ${{ secrets.ACR_LOGIN_SERVER }}/medical-backend:latest
    
    - name: Build and push Frontend image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./frontend/Dockerfile
        push: true
        tags: |
          ${{ secrets.ACR_LOGIN_SERVER }}/medical-frontend:${{ github.sha }}
          ${{ secrets.ACR_LOGIN_SERVER }}/medical-frontend:latest
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Configure Azure credentials
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Get AKS credentials
      run: |
        az aks get-credentials \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --name ${{ secrets.AKS_CLUSTER_NAME }} \
          --overwrite-existing
    
    - name: Deploy to AKS
      run: |
        kubectl apply -f kubernetes/deployment.yaml
        kubectl set image deployment/backend \
          backend=${{ secrets.ACR_LOGIN_SERVER }}/medical-backend:${{ github.sha }} \
          -n medical-diagnosis
        kubectl set image deployment/frontend \
          frontend=${{ secrets.ACR_LOGIN_SERVER }}/medical-frontend:${{ github.sha }} \
          -n medical-diagnosis
        kubectl rollout status deployment/backend -n medical-diagnosis
        kubectl rollout status deployment/frontend -n medical-diagnosis
    
    - name: Run smoke tests
      run: |
        kubectl run smoke-test \
          --image=${{ secrets.ACR_LOGIN_SERVER }}/medical-backend:${{ github.sha }} \
          --restart=Never \
          -n medical-diagnosis \
          -- pytest /app/tests/smoke_tests.py || true
