name: Automated Code Quality Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - main
      - develop

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  code-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install black[jupyter]==24.1.1 isort==5.13.2 flake8==7.0.0 autopep8==2.0.4

      - name: Create fix branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          BRANCH_NAME="automated/fixes-$(date +%s)"
          git checkout -b $BRANCH_NAME
          echo "FIX_BRANCH=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Apply Black formatting
        run: |
          echo "Applying Black code formatting..."
          black backend/ --line-length 120 --target-version py311
          echo "Black formatting completed"

      - name: Sort imports with isort
        run: |
          echo "Sorting imports with isort..."
          isort backend/ --profile black --line-length 120
          echo "Import sorting completed"

      - name: Auto-fix with autopep8
        run: |
          echo "Running autopep8 fixes..."
          find backend/ -name "*.py" -type f ! -path "*/venv/*" ! -path "*/__pycache__/*" | while read file; do
            autopep8 --in-place --aggressive --aggressive "$file"
          done
          echo "Autopep8 fixes completed"

      - name: Verify code with flake8
        continue-on-error: true
        run: |
          echo "Running flake8 verification..."
          flake8 backend/ --max-line-length=120 --extend-ignore=E203,W503,E501 --statistics --count || true

      - name: Check for Python syntax errors
        run: |
          echo "Verifying Python syntax..."
          python -m py_compile backend/app/*.py || true
          echo "Syntax verification completed"

      - name: Detect changes
        id: check-changes
        run: |
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "=== Changes Detected ==="
            git diff --stat
          fi

      - name: Commit code fixes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git add backend/
          git commit -m "Automated code quality fixes: formatting and linting" \
                     -m "- Applied Black code formatting" \
                     -m "- Sorted imports with isort" \
                     -m "- Applied autopep8 fixes" \
                     -m "- Verified with flake8" \
                     --no-verify || true

      - name: Push fixes to branch
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git push origin ${{ env.FIX_BRANCH }}

      - name: Create Pull Request with fixes
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Automated code quality fixes: formatting and linting'
          branch: ${{ env.FIX_BRANCH }}
          delete-branch: true
          title: 'Automated Code Quality: Formatting and Linting Fixes'
          body: |
            ## Automated Code Quality Improvements
            
            This pull request contains the following automated fixes:
            
            - **Black Formatting**: Consistent code style applied
            - **Import Sorting**: Imports organized with isort
            - **PEP 8 Compliance**: Fixed via autopep8
            - **Linting Verification**: Verified with flake8
            
            ### Review Checklist
            - [ ] Review formatting changes
            - [ ] Verify no functional changes were introduced
            - [ ] Run local tests to confirm
            - [ ] Merge when satisfied
            
            Generated at: ${{ github.run_id }}
          labels: 'automated,code-quality,review-required'
          draft: false
          head-branch: ${{ env.FIX_BRANCH }}
          base: ${{ github.ref }}

      - name: Report results
        if: always()
        run: |
          echo "=== Code Quality Pipeline Summary ==="
          echo "Python Version: ${{ matrix.python-version }}"
          echo "Changes Detected: ${{ steps.check-changes.outputs.has_changes }}"
          echo "Fix Branch: ${{ env.FIX_BRANCH }}"
          echo "Status: Pipeline completed successfully"
